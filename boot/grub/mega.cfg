set default=0
set timeout=12

menuentry "ArozOS Live" {
    linux /boot/vmlinuz-lts aroz.mode=live ip=dhcp quiet
    initrd /boot/initramfs-lts
}

menuentry "ArozOS Live (debug)" {
    linux /boot/vmlinuz-lts aroz.mode=debug ip=dhcp
    initrd /boot/initramfs-lts
}

menuentry "ArozOS Installer" {
    linux /boot/vmlinuz-lts aroz.mode=installer
    initrd /boot/initramfs-lts
}

menuentry "ArozOS Rescue" {
    linux /boot/vmlinuz-lts aroz.mode=rescue
    initrd /boot/initramfs-lts
}

menuentry "Alpine maintenance shell" {
    linux /boot/vmlinuz-lts aroz.mode=alpine
    initrd /boot/initramfs-lts
}

menuentry "ArozOS PXE Server Edition" {
    linux /boot/vmlinuz-lts aroz.mode=pxe-se ip=dhcp
    initrd /boot/initramfs-lts
}

menuentry "Network boot with iPXE" {
    if [ "${grub_platform}" = "efi" ]; then
        chainloader /ipxe/ipxe-x86_64.efi
    else
        linux16 /ipxe/ipxe.lkrn
    fi
}

menuentry "Return to firmware / next boot device" {
    exit
}
