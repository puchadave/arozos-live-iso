# webOwie / ArozOS PXE Server Edition
# Safe default: DNS disabled, ProxyDHCP only. Existing DHCP remains authoritative.
port=0
log-dhcp
bind-dynamic

dhcp-range=192.168.0.0,proxy,255.255.255.0

# Client architecture tags from RFC 4578 / PXE conventions.
dhcp-match=set:bios,option:client-arch,0
dhcp-match=set:efi32,option:client-arch,6
dhcp-match=set:efibc,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
dhcp-match=set:arm64,option:client-arch,11

# Initial handoff. iPXE then switches to HTTP for larger payloads.
dhcp-boot=tag:bios,undionly.kpxe
dhcp-boot=tag:efi32,ipxe-i386.efi
dhcp-boot=tag:efibc,ipxe-x86_64.efi
dhcp-boot=tag:efi64,ipxe-x86_64.efi
dhcp-boot=tag:arm64,ipxe-arm64.efi

enable-tftp
tftp-root=/var/lib/arozos-pxe-se/tftp
