# webOwie / ArozOS PXE Server Edition template
# Safe default: DNS disabled, ProxyDHCP only. Existing DHCP remains authoritative.
# @PROXY_NET@ and @SERVER_IP@ are rendered into /run by arozos-pxe-se.
port=0
log-dhcp
bind-dynamic

dhcp-range=@PROXY_NET@,proxy

# Detect clients which are already running iPXE so they receive the script
# instead of being handed the iPXE binary again.
dhcp-userclass=set:ipxe,iPXE
dhcp-boot=tag:ipxe,http://@SERVER_IP@:8081/boot.ipxe

# Client architecture tags from RFC 4578 / PXE conventions.
dhcp-match=set:bios,option:client-arch,0
dhcp-match=set:efibc,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
dhcp-match=set:arm64,option:client-arch,11

# Initial handoff. iPXE then switches to HTTP for larger payloads.
dhcp-boot=tag:!ipxe,tag:bios,undionly.kpxe
dhcp-boot=tag:!ipxe,tag:efibc,ipxe-x86_64.efi
dhcp-boot=tag:!ipxe,tag:efi64,ipxe-x86_64.efi
dhcp-boot=tag:!ipxe,tag:arm64,ipxe-arm64.efi

enable-tftp
tftp-root=/var/lib/arozos-pxe-se/tftp
